
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102d59">
  <link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
  <title>Sky Chasers Attendance</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5fa;
      margin: 0;
      padding: 24px;
      color: #102d59;
    }
    main {
      max-width: 420px;
      margin: 30px auto;
      background: white;
      padding: 24px;
      border-radius: 18px;
      box-shadow: 0 4px 20px #0001;
    }
    h1 { text-align: center; font-size: 24px; }
    p { text-align: center; color: #64748b; }
    label { display: block; margin-top: 18px; font-weight: bold; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 16px;
      border: 0;
      border-radius: 9px;
      color: white;
      background: #102d59;
      font-size: 16px;
      font-weight: bold;
    }
    .checkin { background: #197448; }
    #message { margin-top: 18px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>SKY CHASERS</h1>
    <p>EMPLOYEE ATTENDANCE</p>

    <label for="employeeId">Employee ID</label>
    <input id="employeeId" autocomplete="username"
           placeholder="Enter employee ID">

    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric"
           autocomplete="current-password" placeholder="Enter PIN">

    <button class="checkin" onclick="sendAttendance('CHECK IN')">
      CHECK IN
    </button>
    <button onclick="sendAttendance('CHECK OUT')">
      CHECK OUT
    </button>

    <div id="message" role="status"></div>
  </main>

  <script>
    function sendAttendance(action) {
      document.getElementById('message').textContent =
        'The attendance connection has not been configured yet.';
    }
  </script>
</body>
</html>
